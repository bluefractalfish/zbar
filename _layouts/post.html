---
layout: default
---

<article class="post text-block">
  <header class="post__header">
    <p class="post__meta type__mark">
      {{ page.date | date: "%Y.%m.%d" }}
      {% if page.author %} · {{ page.author }}{% endif %}
    </p>

    <h1 class="post__title type__display">{{ page.title }}</h1>

    {% if page.description %}
      <p class="post__description type__prose">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post__body type__prose">
    {{ content }}
  </div>

  <footer class="post__footer">
    <a class="button" href="{{ '/blog/' | relative_url }}">← all posts</a>
  </footer>
</article>
